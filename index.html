<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TableTap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EA;--ink:#16201B;--mut:#66706A;--card:#fff;--line:#D8DDD4;--go:#1E6B4E;--warn:#E39A0B;--bad:#C23B2B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}h2{font-size:21px}h3{font-size:17px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.wide{max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
textarea{min-height:170px}
label{font-size:14px;color:var(--mut)}
.b{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;cursor:pointer;min-height:44px}
.b:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.b.go{background:var(--go)}.b.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.b.sm{padding:6px 10px;min-height:32px;font-size:14px}.b:disabled{opacity:.55;cursor:default}
.b.full{width:100%;margin-top:10px}
.note{background:#FFF4D6;border:1px solid #F0D88A;border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0 4px}
header.top small{color:var(--mut)}
.call{background:var(--warn);color:#1b1300;white-space:nowrap}.call.on{background:#e8e3d0;color:var(--mut)}
.cat{margin:20px 0 4px;color:var(--go)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it b{display:block;font-weight:500}
.stp{display:flex;align-items:center;gap:10px}.stp i{font-style:normal;min-width:20px;text-align:center;font-weight:700}
.stp button{width:40px;height:40px;border-radius:50%;border:1px solid var(--go);background:#fff;color:var(--go);font-size:20px;cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:8px;padding:6px 0;align-items:center}
.ln em{color:var(--warn);font-size:13px;font-style:normal;font-weight:700}
.tot{border-top:1px solid var(--line);font-weight:700;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.bar .b{width:100%;max-width:528px;display:block;margin:0 auto;background:var(--go);font-size:17px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:9}
.ov .card{width:100%;max-width:520px;max-height:85vh;overflow:auto}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs .b{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs .b.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{margin:0}.tc.idle{opacity:.6}.tc.ring{border:2px solid var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #E39A0B44}}
.pill{font-size:12px;font-weight:700;background:var(--bg);border-radius:99px;padding:3px 10px}
.alert{background:#FFF4D6;border-radius:10px;padding:8px 10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.req{background:#FDECEA;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}.req .row{justify-content:flex-start;margin-top:6px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.qc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.qc>div{display:flex;justify-content:center;margin-bottom:8px}.qc b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.brand{font-size:38px}
.hero{background:linear-gradient(135deg,#1E6B4E,#16201B);color:#fff;border-radius:0 0 26px 26px;padding:18px 16px 22px;margin:-16px -16px 10px}
.hero small{opacity:.75}.hero h1{color:#fff;font-size:34px}.hero .call{box-shadow:0 4px 14px #0004}
.status{background:#E7F4EC;border:1px solid #BFE0CD;border-radius:14px;padding:14px;margin:12px 0;display:flex;gap:12px;align-items:center}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--go);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.card{box-shadow:0 1px 3px #16201B10}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;max-width:720px}
.tabs{overflow-x:auto}.tabs .b{white-space:nowrap}
select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
.toast{position:fixed;top:12px;left:12px;right:12px;z-index:30;background:#16201B;color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 6px 20px #0005}
.b.bad{color:var(--bad);border-color:var(--bad)}
@media print{.np{display:none!important}body{background:#fff}.wrap{padding:0;max-width:none}}
@media (prefers-reduced-motion:reduce){.tc.ring{animation:none}}
</style></head>
<body><div id="app"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== SETUP: no editing needed here. Put your Supabase URL and anon key in a small file named config.js next to this page. Without it, the app runs in single-browser demo mode. ===== */
const CFG=window.TT||{};
const SUPA_URL=String(CFG.url||"").trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""), SUPA_KEY=String(CFG.key||"").trim();

const $=(s,r=document)=>r.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const uid=()=>Math.random().toString(36).slice(2,8);
const rs=n=>'₹'+(+n).toLocaleString('en-IN');
const blank=()=>({sid:'0',items:[],reqs:[],call:0});
const msg=(h,p)=>`<div class=wrap><div class=card><h2>${h}</h2><p class=mut>${p}</p></div></div>`;
const P=new URLSearchParams(location.search), BASE=location.href.split('?')[0].split('#')[0];
const acts={};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}
function ask(h,ok,fn){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=card><p>${h}</p><div class=row style="margin-top:12px;gap:8px"><button class="b ghost" data-x=n>Back</button><button class="b go" data-x=y>${ok}</button></div></div>`;o.onclick=e=>{const x=e.target.dataset&&e.target.dataset.x;if(!x)return;o.remove();if(x==='y')fn()};document.body.appendChild(o)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&acts[b.dataset.a])acts[b.dataset.a](b.dataset,b)});

/* ===== data layer: one table "kv" (k, venue, v). Swappable: Supabase or localStorage demo ===== */
const sb=(SUPA_URL&&SUPA_KEY&&window.supabase)?supabase.createClient(SUPA_URL,SUPA_KEY):null;
const DB={demo:!sb,
 async get(k){
  if(sb){const {data,error}=await sb.from('kv').select('v').eq('k',k).maybeSingle();if(error)throw error;return data?data.v:null}
  const s=localStorage.getItem('tt:'+k);return s?JSON.parse(s):null},
 async set(k,venue,v){
  if(sb){const {error}=await sb.from('kv').upsert({k,venue,v});if(error)throw error;return}
  localStorage.setItem('tt:'+k,JSON.stringify(v))},
 async list(venue){
  if(sb){const {data,error}=await sb.from('kv').select('k,v').eq('venue',venue).like('k','tbl:%');if(error)throw error;return data||[]}
  const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tt:tbl:'+venue+':'))o.push({k:k.slice(3),v:JSON.parse(localStorage.getItem(k))})}return o},
 async user(){if(!sb)return localStorage.getItem('ttmaster')==='1';const {data}=await sb.auth.getSession();return !!data.session},
 async signIn(e,p){const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error},
 async signOut(){if(sb)await sb.auth.signOut();else localStorage.removeItem('ttmaster')},
 async savePin(id,pin){if(sb){const {error}=await sb.from('pins').upsert({venue:id,pin});if(error)throw error}else localStorage.setItem('tt:pin:'+id,pin)},
 async ownerVenue(c){
  if(sb){const {data,error}=await sb.rpc('owner_venue',{c});if(error)throw error;return data||null}
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tt:pin:')&&localStorage.getItem(k).toLowerCase()===c.toLowerCase())return k.slice(7)}return null},
 async codes(){
  const m={};
  if(sb){const {data,error}=await sb.from('pins').select('venue,pin');if(error)throw error;(data||[]).forEach(r=>m[r.venue]=r.pin);return m}
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tt:pin:'))m[k.slice(7)]=localStorage.getItem(k)}return m},
 async venues(){
  if(sb){const {data,error}=await sb.from('kv').select('v').like('k','venue:%');if(error)throw error;return (data||[]).map(r=>r.v)}
  const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tt:venue:'))o.push(JSON.parse(localStorage.getItem(k)))}return o},
 async remove(id){
  if(sb){await sb.from('kv').delete().eq('venue',id);await sb.from('pins').delete().eq('venue',id);await sb.from('acc').delete().eq('venue',id);return}
  const ks=[];for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i));
  ks.filter(k=>k.startsWith('tt:tbl:'+id+':')||k==='tt:venue:'+id||k==='tt:pin:'+id||k.startsWith('tt:acc:'+id+':')).forEach(k=>localStorage.removeItem(k))},
 async accList(v,m){
  if(sb){if(m){const {data,error}=await sb.from('acc').select('d').eq('venue',v);if(error)throw error;return data.map(r=>r.d)}
   const {data,error}=await sb.rpc('acc_list',{c:localStorage.getItem('ttown')});if(error)throw error;return data||[]}
  const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('tt:acc:'+v+':'))o.push(JSON.parse(localStorage.getItem(k)))}return o},
 async accPut(v,m,e){
  if(sb){const r=m?await sb.from('acc').upsert({id:e.id,venue:v,d:e}):await sb.rpc('acc_put',{c:localStorage.getItem('ttown'),e});if(r.error)throw r.error;return}
  localStorage.setItem('tt:acc:'+v+':'+e.id,JSON.stringify(e))},
 async accDel(v,m,id){
  if(sb){const r=m?await sb.from('acc').delete().eq('id',id).eq('venue',v):await sb.rpc('acc_del',{c:localStorage.getItem('ttown'),i:id});if(r.error)throw r.error;return}
  localStorage.removeItem('tt:acc:'+v+':'+id)},
 watch(venue,cb){
  if(sb)sb.channel('v'+venue+uid()).on('postgres_changes',{event:'*',schema:'public',table:'kv',filter:'venue=eq.'+venue},cb).subscribe();
  else addEventListener('storage',cb)}
};

/* ===== menu text <-> list.  Lines: "# Category" then "Item name - 120" ===== */
function parseMenu(t){let c='',o=[];for(const l of t.split(/\r?\n/)){const x=l.trim();if(!x)continue;
 if(x[0]==='#'){c=x.replace(/^#+\s*/,'');continue}
 const m=x.match(/^(.+?)[\s,;:|\-–—]+(?:₹|Rs\.?\s*)?(\d+(?:\.\d+)?)\s*$/);
 if(m)o.push({c,n:m[1].trim().replace(/[,;:|]+$/,''),p:+m[2]})}return o}
const menuText=m=>{let c=null,o=[];m.forEach(x=>{if(x.c!==c){c=x.c;if(c)o.push('# '+c)}o.push(x.n+' - '+x.p)});return o.join('\n')};

/* ===================== CUSTOMER (scan QR: ?v=VENUE&t=TABLE) ===================== */
async function customer(vid,t){
 let v=await DB.get('venue:'+vid);
 if(!v||!(t>=1&&t<=v.tables)){app.innerHTML=msg('This QR code isn’t valid','Please ask a staff member for help.');return}
 const key=`tbl:${vid}:${t}`;
 let st=(await DB.get(key))||blank(),cart={},ed=null,over=false;const sid=st.sid;
 const end=()=>{over=true;cart={};ed=null;app.innerHTML=`<div class=wrap><div class=card style="text-align:center;margin-top:40px"><div style="font-size:44px">🙏</div><h2>Thank you!</h2><p class=mut>This table’s session has ended. To order again, please scan the QR code on the table.</p></div></div>`};
 const mut=async fn=>{if(over)return;try{const s=(await DB.get(key))||blank();if(s.sid!==sid){end();return}fn(s);await DB.set(key,vid,s);st=s;draw()}catch(e){toast('Ordering is unavailable right now. Please ask a staff member for help.')}};
 function draw(){
  if(over)return;
  if(v.active===false){app.innerHTML=msg('Ordering is paused','Please ask a staff member to take your order.');return}
  const pt=st.items.reduce((a,i)=>a+i.p*i.q,0);
  const cn=Object.values(cart).reduce((a,b)=>a+b,0), ct=v.menu.reduce((a,m,i)=>a+m.p*(cart[i]||0),0);
  let last=null,menu='';
  v.menu.forEach((m,i)=>{if(m.c!==last){if(m.c)menu+=`<h3 class=cat>${esc(m.c)}</h3>`;last=m.c}
   const q=cart[i]||0;
   menu+=`<div class=it><div><b>${esc(m.n)}</b><span class=mut>${rs(m.p)}</span></div><div class=stp>${q?`<button aria-label="Less" data-a=dec data-i=${i}>−</button><i>${q}</i>`:''}<button aria-label="More" data-a=inc data-i=${i}>+</button></div></div>`});
  const reqOf=id=>st.reqs.find(r=>r.iid===id);
  const status=st.items.length?`<div class=status><span class=dot></span><div><b>Please wait, your order is getting ready</b><div class=mut>We’ll bring it to your table. You can keep adding items below.</div></div></div>`:'';
  const placed=st.items.length?`<div class=card><h3>Your order</h3>${st.items.map(i=>`<div class=ln><span>${i.q} × ${esc(i.n)} ${reqOf(i.id)?'<em>change requested</em>':''}</span><span>${rs(i.p*i.q)}</span></div>`).join('')}<div class="ln tot"><span>Total so far</span><span>${rs(pt)}</span></div><button class="b ghost full" data-a=edit>Edit order</button></div>`:'';
  const modal=ed?`<div class=ov><div class=card><h3>Edit order</h3><p class=mut>Staff will review your request. Set an item to 0 to ask for cancellation.</p>${st.items.map(i=>`<div class=it><div><b>${esc(i.n)}</b><span class=mut>ordered ${i.q}</span></div><div class=stp><button data-a=edm data-id=${i.id}>−</button><i>${ed[i.id]}</i><button data-a=edp data-id=${i.id}>+</button></div></div>`).join('')}<div class=row style="margin-top:12px"><button class="b ghost" data-a=edx>Close</button><button class="b go" data-a=eds>Send request</button></div></div></div>`:'';
  app.innerHTML=`<div class=wrap><div class=hero><div class=row><div><small>${esc(v.name)}</small><h1>Table ${t}</h1></div><button class="b call${st.call?' on':''}" data-a=call ${st.call?'disabled':''}>🛎️ ${st.call?'Waiter is coming':'Call waiter'}</button></div></div>${status}${placed}${menu}${cn?`<div class=bar><button class=b data-a=place>Place order · ${cn} item${cn>1?'s':''} · ${rs(ct)}</button></div>`:''}${modal}</div>`}
 Object.assign(acts,{
  inc:d=>{cart[d.i]=(cart[d.i]||0)+1;draw()},
  dec:d=>{cart[d.i]=Math.max(0,(cart[d.i]||0)-1);draw()},
  place:()=>ask('Place this order? Once placed it can’t be cancelled — you can only send an edit request to staff.','Place order',()=>{
   const items=Object.entries(cart).filter(([,q])=>q>0).map(([i,q])=>({id:uid(),n:v.menu[i].n,p:v.menu[i].p,q,at:Date.now()}));
   cart={};mut(s=>{s.items.push(...items)})}),
  call:()=>mut(s=>{s.call=Date.now()}),
  edit:()=>{ed={};st.items.forEach(i=>ed[i.id]=i.q);draw()},
  edm:d=>{ed[d.id]=Math.max(0,ed[d.id]-1);draw()},
  edp:d=>{const o=st.items.find(i=>i.id===d.id);ed[d.id]=Math.min(o.q,ed[d.id]+1);draw()},
  edx:()=>{ed=null;draw()},
  eds:()=>{const e=ed,ch=st.items.filter(i=>e[i.id]!==i.q);ed=null;if(!ch.length){draw();return}
   mut(s=>{ch.forEach(i=>{s.reqs=s.reqs.filter(r=>r.iid!==i.id);s.reqs.push({id:uid(),iid:i.id,n:i.n,from:i.q,q:e[i.id]})})})}
 });
 DB.watch(vid,async()=>{if(over)return;v=(await DB.get('venue:'+vid))||v;const s=(await DB.get(key))||blank();if(s.sid!==sid){end();return}st=s;if(!ed)draw()});
 draw();
}

/* ===================== OWNER / ADMIN ===================== */
let ac;const beep=()=>{try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.start();o.stop(ac.currentTime+.4)}catch(e){}};

function form(v){return `<label>Venue name</label><input id=fn value="${v?esc(v.name):''}" placeholder="Cafe Monsoon">
<label>Number of tables</label><input id=ft type=number min=1 max=200 value="${v?v.tables:''}" placeholder="12">
<label>Owner access ID — you choose it (8+ letters or numbers). The owner types this to see their venue.${v?' Leave blank to keep the current one.':''}</label><div class=row><input id=fp autocomplete=off placeholder="e.g. MONSOON7K2P"><button type=button class="b ghost sm" data-a=gen>Generate</button></div>
<label>Menu — one item per line as “Name - price”. Start a line with # for a category.</label>
<textarea id=fm placeholder="# Starters&#10;Paneer Tikka - 220&#10;# Drinks&#10;Cold Coffee - 120">${v?esc(menuText(v.menu)):''}</textarea>
<label>Or load a .txt / .csv file in the same format</label><input type=file accept=".txt,.csv" onchange="this.files[0]&&this.files[0].text().then(t=>$('#fm').value=t)">
<button class="b go full" data-a=save data-id="${v?v.id:''}">Save venue</button>`}

acts.save=async d=>{
 const name=$('#fn').value.trim(),tables=Math.floor(+$('#ft').value),code=$('#fp').value.trim(),menu=parseMenu($('#fm').value);
 const okCode=c=>/^[A-Za-z0-9-]{8,40}$/.test(c);
 if(!name||!(tables>0&&tables<=200)||!menu.length||(!d.id&&!okCode(code))||(code&&!okCode(code))){toast('Add a venue name, 1–200 tables, at least one menu line like “Tea - 40”, and an owner access ID of 8+ letters or numbers (Generate makes one).');return}
 const id=d.id||uid();
 try{
  if(code){const ex=await DB.ownerVenue(code);if(ex&&ex!==id){toast('That access ID is already used by another venue. Pick a different one.');return}}
  const old=d.id?await DB.get('venue:'+id):null;
  await DB.set('venue:'+id,id,{id,name,tables,menu,active:old?old.active!==false:true});
  if(code)await DB.savePin(id,code)}catch(e){toast('Could not save: '+e.message);return}
 location.href=BASE};
acts.gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';$('#fp').value=Array.from(crypto.getRandomValues(new Uint32Array(10)),n=>a[n%32]).join('')};
acts.enter=()=>{const c=$('#oc').value.trim();if(!c)return;localStorage.setItem('ttown',c);location.href=BASE};
acts.oout=()=>{localStorage.removeItem('ttown');location.href=BASE};
acts.msign=async()=>{try{if(DB.demo)localStorage.setItem('ttmaster','1');else await DB.signIn($('#me').value.trim(),$('#mp').value);location.href=BASE}catch(e){toast('Sign-in failed: '+e.message)}};
acts.msout=async()=>{await DB.signOut();location.href=BASE};

async function dash(v,master){
 let tab='live',rows=await DB.list(v.id),prev=-1,acc=[],accErr='',day=ymd(Date.now()),ed2=null,pay=null,range=30,charts=[],xf=ymd(Date.now()).slice(0,8)+'01',xt=ymd(Date.now());
 const A={list:()=>DB.accList(v.id,master),put:e=>DB.accPut(v.id,master,e),del:id=>DB.accDel(v.id,master,id)};
 const loadAcc=async()=>{try{acc=await A.list();accErr=''}catch(e){accErr=e.message}};
 await loadAcc();
 const load=async()=>{rows=await DB.list(v.id)};
 const count=()=>rows.reduce((a,r)=>a+r.v.items.length+r.v.reqs.length+(r.v.call?1:0),0);
 const tot=s=>s.items.reduce((a,i)=>a+i.p*i.q,0);
 const NOTE=()=>accErr?`<div class=note>Accounts need the one-time database setup (see the SQL). Details: ${esc(accErr)}</div>`:'';
 const mt=async(t,fn)=>{const k=`tbl:${v.id}:${t}`;const s=(await DB.get(k))||blank();fn(s);await DB.set(k,v.id,s);await load();render()};
 let pend=[],pendErr='',busy=false;try{pend=JSON.parse(localStorage.getItem('ttq:'+v.id)||'[]')}catch(e){}
 const savePend=()=>{try{localStorage.setItem('ttq:'+v.id,JSON.stringify(pend))}catch(e){}};
 const flush=async()=>{const rest=[];for(const e of pend){try{await A.put(e)}catch(x){pendErr=x.message;rest.push(e)}}pend=rest;savePend();if(!rest.length)pendErr='';await loadAcc()};
 const finish=async(t,status,method)=>{
  if(busy||!t)return;busy=true;const k=`tbl:${v.id}:${t}`;
  try{
   const s=(await DB.get(k))||blank();
   const ent=s.items.length&&status==='paid'?{id:uid()+uid(),ts:Date.now(),date:ymd(Date.now()),table:String(t),items:s.items.map(i=>({n:i.n,p:i.p,q:i.q})),total:tot(s),method,status}:null;
   await DB.set(k,v.id,Object.assign(s,{sid:uid(),items:[],reqs:[],call:0}));
   if(ent){pend.push(ent);savePend();await flush()}
   toast(status==='paid'?`Table ${t} completed`:`Table ${t} order cancelled`+(pend.length?'':''));
  }catch(e){toast('Could not update the table: '+e.message)}
  busy=false;await load();render()};
 const PEND=()=>pend.length?`<div class=note style="background:#FDECEA;border-color:#E6B0A9">${pend.length} accounting entr${pend.length>1?'ies are':'y is'} not saved yet. The orders were completed, and the entries are kept on this phone until they save. ${esc(pendErr)} <button class="b sm" data-a=retry>Retry now</button></div>`:'';
 function live(){
  const m={};rows.forEach(r=>m[r.k.split(':')[2]]=r.v);let o='';
  for(let t=1;t<=v.tables;t++){const s=m[t]||blank(),act=s.items.length||s.call;
   o+=`<div class="card tc${s.call?' ring':''}${act?'':' idle'}"><div class=row><h3>Table ${t}</h3><span class=pill>${s.items.length?'Occupied':s.call?'Needs help':'Free'}</span></div>`;
   if(s.call)o+=`<div class=alert><span>🛎️ Waiter called</span><button class="b sm" data-a=att data-t=${t}>Attended</button></div>`;
   s.reqs.forEach(r=>o+=`<div class=req><b>Edit request:</b> ${esc(r.n)} ${r.from} → ${r.q===0?'cancel':r.q}<div class=row><button class="b sm go" data-a=ok data-t=${t} data-id=${r.id}>Approve</button><button class="b sm ghost" data-a=no data-t=${t} data-id=${r.id}>Reject</button></div></div>`);
   s.items.forEach(i=>o+=`<div class=ln><span>${i.q} × ${esc(i.n)}</span><span>${rs(i.p*i.q)} <button class="b sm ghost" aria-label="One less" data-a=minus data-t=${t} data-id=${i.id}>−</button> <button class="b sm ghost" aria-label="Remove item" data-a=rm data-t=${t} data-id=${i.id}>✕</button></span></div>`);
   if(act)o+=`<div class="ln tot"><span>Total</span><span>${rs(tot(s))}</span></div><div class=row style="margin-top:8px"><button class="b go" style="flex:1" data-a=pay data-t=${t}>Complete order</button><button class="b ghost bad" data-a=cxl data-t=${t}>Order cancelled</button></div>`;
   o+='</div>'}
  return `<div class=grid>${o}</div>`}
 function accounts(){
  const L=acc.filter(e=>e.date===day).sort((a,b)=>a.ts-b.ts),P=L.filter(e=>e.status==='paid'),rev=P.reduce((a,e)=>a+e.total,0);
  const shift=n=>ymd(new Date(day+'T12:00:00').getTime()+n*864e5);
  return `${NOTE()}<div class=card><div class=row><button class="b ghost sm" data-a=dday data-d=${shift(-1)}>‹ Prev</button><input type=date value=${day} onchange="acts.setday(this.value)" style="width:auto;margin:0"><button class="b ghost sm" data-a=dday data-d=${shift(1)}>Next ›</button></div></div>
  <div class=card><h3>Export accounts</h3><div class=row style="gap:8px;align-items:flex-end"><div style="flex:1"><label>From</label><input type=date value=${xf} onchange="acts.xset('f',this.value)"></div><div style="flex:1"><label>To</label><input type=date value=${xt} onchange="acts.xset('t',this.value)"></div></div><div class=row style="gap:8px;margin-top:8px"><button class="b go" style="flex:1" data-a=xlsx>Excel (.xlsx)</button><button class="b" style="flex:1" data-a=pdf>PDF</button></div></div>
  <div class=kpis><div class=kpi><span class=mut>Collected</span><b>${rs(rev)}</b></div><div class=kpi><span class=mut>Orders</span><b>${P.length}</b></div><div class=kpi><span class=mut>Cancelled</span><b>${L.length-P.length}</b></div></div>
  <div class=row style="margin:12px 0"><h3>Entries</h3><button class="b sm go" data-a=eadd>+ Add entry</button></div>
  ${L.length?L.map(e=>`<div class=card style="margin:8px 0"><div class=row><b>${new Date(e.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · Table ${esc(e.table)}</b><span class=pill>${e.status==='paid'?'Paid · '+esc(e.method||'—'):'Cancelled'}</span></div><div class=mut>${e.items.map(i=>i.q+'× '+esc(i.n)).join(', ')||'No items'}</div><div class=row style="margin-top:6px"><b>${rs(e.total)}</b><span><button class="b sm ghost" data-a=eedit data-id=${e.id}>Edit</button> <button class="b sm ghost" data-a=edel data-id=${e.id}>Delete</button></span></div></div>`).join(''):'<p class=mut>No entries for this date.</p>'}`}
 function ana(){
  const from=Date.now()-range*864e5,P=acc.filter(e=>e.status==='paid'&&e.ts>=from),rev=P.reduce((a,e)=>a+e.total,0),cx=acc.filter(e=>e.status!=='paid'&&e.ts>=from).length;
  return `${NOTE()}<div class="tabs np">${[7,30,90].map(r=>`<button class="b${range===r?' on':''}" data-a=rng data-r=${r}>${r} days</button>`).join('')}</div><div class=kpis><div class=kpi><span class=mut>Revenue</span><b>${rs(rev)}</b></div><div class=kpi><span class=mut>Orders</span><b>${P.length}</b></div><div class=kpi><span class=mut>Avg order</span><b>${rs(P.length?Math.round(rev/P.length):0)}</b></div><div class=kpi><span class=mut>Cancelled</span><b>${cx}</b></div></div><div class=chart><h3>Revenue per day</h3><canvas id=c1></canvas></div><div class=chart><h3>Top items (by sales)</h3><canvas id=c2></canvas></div><div class=chart><h3>Payment methods</h3><canvas id=c3></canvas></div><div class=chart><h3>Busy hours (orders)</h3><canvas id=c4></canvas></div>`}
 function draw2(){
  charts.forEach(c=>c.destroy());charts=[];if(tab!=='ana'||typeof Chart==='undefined')return;
  const from=Date.now()-range*864e5,P=acc.filter(e=>e.status==='paid'&&e.ts>=from);
  const days=Array.from({length:range},(_,i)=>ymd(Date.now()-(range-1-i)*864e5)),byDay={},it={},me={},hr=Array(24).fill(0);
  P.forEach(e=>{byDay[e.date]=(byDay[e.date]||0)+e.total;const k=e.method||'Other';me[k]=(me[k]||0)+e.total;hr[new Date(e.ts).getHours()]++;e.items.forEach(i=>{it[i.n]=(it[i.n]||0)+i.p*i.q})});
  const top=Object.entries(it).sort((a,b)=>b[1]-a[1]).slice(0,8),base={responsive:true,plugins:{legend:{display:false}}};
  const mk=(id,cfg)=>{const c=$('#'+id);if(c)charts.push(new Chart(c,cfg))};
  mk('c1',{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:[{data:days.map(d=>byDay[d]||0),backgroundColor:'#1E6B4E',borderRadius:4}]},options:base});
  mk('c2',{type:'bar',data:{labels:top.map(x=>x[0]),datasets:[{data:top.map(x=>x[1]),backgroundColor:'#E39A0B',borderRadius:4}]},options:{...base,indexAxis:'y'}});
  mk('c3',{type:'doughnut',data:{labels:Object.keys(me),datasets:[{data:Object.values(me),backgroundColor:['#1E6B4E','#E39A0B','#16201B','#C23B2B']}]},options:{responsive:true,plugins:{legend:{position:'bottom'}}}});
  mk('c4',{type:'bar',data:{labels:hr.map((_,h)=>h+'h'),datasets:[{data:hr,backgroundColor:'#16201B',borderRadius:3}]},options:base})}
 function render(){
  const n=count();if(prev>=0&&n>prev)beep();prev=n;
  const qrh=`<div class="row np" style="margin-bottom:12px"><p class=mut>Print, cut, and stick one on each table.</p><button class="b" onclick="print()">Print QR codes</button></div><div class=qrs>${Array.from({length:v.tables},(_,i)=>`<div class=qc><div id=q${i+1}></div><b>Table ${i+1}</b><a class=np style="display:block;font-size:13px;margin-top:6px" href="${BASE}?v=${v.id}&t=${i+1}" target="_blank">Open this table</a></div>`).join('')}</div>`;
  const seth=`<div class=card><h3>Owner access</h3><p class=mut>The owner opens ${esc(BASE)} and types their access ID. You can see every venue’s access ID on the master panel.</p></div><div class=card><h2>Edit venue</h2>${form(v)}</div>`;
  const body=PEND()+(tab==='live'?live():tab==='acc'?accounts():tab==='ana'?ana():tab==='qr'?qrh:seth);
  const pt=pay?tot((rows.find(r=>r.k===`tbl:${v.id}:${pay}`)||{v:blank()}).v):0;
  const pm=pay?`<div class=ov><div class=card><h3>Table ${pay} · ${rs(pt)}</h3><p class=mut>How was it paid?</p><div class=row style="gap:8px">${['Cash','UPI','Card'].map(m=>`<button class="b go" style="flex:1" data-a=paid data-m=${m}>${m}</button>`).join('')}</div><button class="b ghost full" data-a=payx>Back</button></div></div>`:'';
  const emod=ed2?`<div class=ov><div class=card><h3>${ed2.isNew?'Add entry':'Edit entry'}</h3><label>Date</label><input id=ead type=date value=${ed2.date}><label>Table</label><input id=eat value="${esc(ed2.table)}"><label>Items — one per line, like: 2 x Tea @ 40</label><textarea id=eai style="min-height:90px">${esc(ed2.items.map(i=>`${i.q} x ${i.n} @ ${i.p}`).join('\n'))}</textarea><label>Amount (leave blank to add up the items)</label><input id=eaa type=number value="${ed2.total}"><label>Payment</label><select id=eap>${['Cash','UPI','Card','Other'].map(m=>`<option${ed2.method===m?' selected':''}>${m}</option>`).join('')}</select><label>Status</label><select id=eas><option value=paid${ed2.status==='paid'?' selected':''}>Paid</option><option value=cancelled${ed2.status!=='paid'?' selected':''}>Cancelled</option></select><div class=row style="margin-top:12px"><button class="b ghost" data-a=ex>Close</button><button class="b go" data-a=esave>Save</button></div></div></div>`:'';
  const tabs=[['live','Live orders'],['acc','Accounts'],['ana','Analytics'],['qr','QR codes'],...(master?[['set','Menu & settings']]:[])];
  app.innerHTML=`<div class="wrap wide"><header class="top np"><div><small>${master?'<a href="'+BASE+'">← Master panel</a>':'Dashboard'}</small><h1>${esc(v.name)}</h1></div>${master?'':'<button class="b ghost sm" data-a=oout>Sign out</button>'}</header><div class="tabs np">${tabs.map(([k,l])=>`<button class="b${tab===k?' on':''}" data-a=tab data-x=${k}>${l}</button>`).join('')}</div>${body}${pm||emod}</div>`;
  if(tab==='qr')for(let i=1;i<=v.tables;i++)new QRCode($('#q'+i),{text:`${BASE}?v=${v.id}&t=${i}`,width:150,height:150});
  draw2()}
 Object.assign(acts,{
  tab:async d=>{tab=d.x;if(tab==='acc'||tab==='ana')await loadAcc();render()},
  att:d=>mt(d.t,s=>{s.call=0}),
  no:d=>mt(d.t,s=>{s.reqs=s.reqs.filter(r=>r.id!==d.id)}),
  ok:d=>mt(d.t,s=>{const r=s.reqs.find(x=>x.id===d.id);if(!r)return;if(r.q===0)s.items=s.items.filter(i=>i.id!==r.iid);else{const i=s.items.find(i=>i.id===r.iid);if(i)i.q=r.q}s.reqs=s.reqs.filter(x=>x.id!==d.id)}),
  minus:d=>mt(d.t,s=>{const i=s.items.find(i=>i.id===d.id);if(!i)return;i.q--;if(i.q<1){s.items=s.items.filter(x=>x.id!==d.id);s.reqs=s.reqs.filter(r=>r.iid!==d.id)}}),
  rm:d=>mt(d.t,s=>{s.items=s.items.filter(i=>i.id!==d.id);s.reqs=s.reqs.filter(r=>r.iid!==d.id)}),
  pay:d=>{pay=+d.t;render()},payx:()=>{pay=null;render()},
  paid:d=>{const t=pay;pay=null;finish(t,'paid',d.m)},retry:async()=>{await flush();render()},
  cxl:d=>ask(`Mark Table ${d.t}’s order as cancelled? The table will be cleared and the customer’s screen will close. Nothing will be recorded in accounts.`,'Yes, cancel order',()=>finish(+d.t,'cancelled','')),
  dday:d=>{day=d.d;render()},
  rng:d=>{range=+d.r;render()},
  eadd:()=>{ed2={id:uid()+uid(),ts:Date.now(),date:day,table:'',items:[],total:0,method:'Cash',status:'paid',isNew:1};render()},
  eedit:d=>{ed2=JSON.parse(JSON.stringify(acc.find(e=>e.id===d.id)));render()},
  ex:()=>{ed2=null;render()},
  edel:d=>ask('Delete this entry permanently?','Delete',async()=>{try{await A.del(d.id);await loadAcc()}catch(e){toast(e.message)}render()}),
  esave:async()=>{
   const its=$('#eai').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+)\s*[x×]\s*(.+?)\s*@\s*(\d+(?:\.\d+)?)$/i);return m?{q:+m[1],n:m[2],p:+m[3]}:null});
   if(its.includes(null)){toast('Write each item like: 2 x Tea @ 40');return}
   const e=ed2,sm=its.reduce((a,i)=>a+i.p*i.q,0);
   e.date=$('#ead').value||e.date;e.table=$('#eat').value.trim();e.items=its;e.total=$('#eaa').value===''?sm:+$('#eaa').value;e.method=$('#eap').value;e.status=$('#eas').value;
   const d0=new Date(e.ts),[y,mo,da]=e.date.split('-').map(Number);e.ts=new Date(y,mo-1,da,d0.getHours(),d0.getMinutes()).getTime();delete e.isNew;
   try{await A.put(e)}catch(x){toast('Could not save: '+x.message);return}
   ed2=null;await loadAcc();render()}
 });
 acts.setday=x=>{if(x){day=x;render()}};
 acts.xset=(w,x)=>{if(x){if(w==='f')xf=x;else xt=x}};
 const inRange=()=>acc.filter(e=>e.date>=xf&&e.date<=xt).sort((a,b)=>a.ts-b.ts);
 const tm=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
 const itx=e=>e.items.map(i=>i.q+' x '+i.n).join(', ');
 const fname=x=>`${v.name.replace(/[^A-Za-z0-9]+/g,'-')}-accounts-${xf}-to-${xt}.${x}`;
 const summ=L=>{const P=L.filter(e=>e.status==='paid'),me={};P.forEach(e=>{const k=e.method||'Other';me[k]=(me[k]||0)+e.total});return {rev:P.reduce((a,e)=>a+e.total,0),n:P.length,cx:L.length-P.length,me}};
 acts.xlsx=()=>{

  s2['!cols']=[{wch:30},{wch:14}];

  d.save(fname('pdf'))};
 DB.watch(v.id,async()=>{await load();if(tab==='live')render()});
 if(pend.length)flush().then(render);
 render();
}

/* ===================== ROUTER ===================== */
(async()=>{
 try{
  const vid=P.get('v');if(vid)return await customer(vid,+P.get('t'));
  if(P.has('master'))return await master();
  if(!P.get('id')&&!P.get('admin')&&await DB.user())return await master();
  const a=P.get('admin');
  if(a&&P.get('m')){
   if(!(await DB.user())){location.href=BASE;return}
   const v=await DB.get('venue:'+a);
   if(!v){app.innerHTML=msg('Venue not found','Go back to the master panel.');return}
   return await dash(v,true)}
  if(P.get('id')){localStorage.setItem('ttown',P.get('id'));history.replaceState(null,'',BASE)}
  let bad='';const code=localStorage.getItem('ttown');
  if(code){
   const id=await DB.ownerVenue(code),v=id&&await DB.get('venue:'+id);
   if(v){
    if(v.active===false){app.innerHTML=msg('Service paused','This venue’s TableTap service is paused. Please contact your TableTap provider.');return}
